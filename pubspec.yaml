name: attandence_v3
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  shared_preferences: ^2.0.13
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0 # Add this line here
  cupertino_icons: ^1.0.6
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  path_provider: ^2.0.11
  intl: ^0.18.0
  excel: ^2.0.7
  share: ^2.0.4
  file_picker: ^5.2.0
  bcrypt: ^1.1.3
  flutter_local_notifications: ^14.0.0
  firebase_messaging: ^15.0.4
  timezone: ^0.9.4
  workmanager: ^0.5.0
  permission_handler: ^10.0.0
  vibration: ^1.7.3
  archive: ^3.6.1

  path: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  android_notification_icons: ^0.0.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/attendance.png"

android_notification_icons:
  image_path: "assets/images/attendance_bg.png"
  icon_name: "attendance_bg"

flutter:
  uses-material-design: true
  fonts:
    - family: Lora
      fonts:
        - asset: fonts/Lora-Bold.ttf
          weight: 700
        - asset: fonts/Lora-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Lora-Italic.ttf
          style: italic
    - family: Play
      fonts:
        - asset: fonts/PlaywriteBEVLG-ExtraLight.ttf
        - asset: fonts/PlaywriteBEVLG-Light.ttf
          style: italic
        - asset: fonts/PlaywriteBEVLG-Thin.ttf

  assets:
   - "assets/images/clg_logo.ico"
   - "assets/images/attendance.png"
   - "assets/images/attendance_bg.png"